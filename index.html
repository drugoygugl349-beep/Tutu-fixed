<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1b2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Туту Fixed">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Туту Fixed</title>
<style>
:root{--bg:#eaf0f6;--card:#fff;--tx:#0e1b2c;--mu:#5d6b7e;--ac:#ffc83d;--on:#0e1b2c;--bd:#d5dee9;--hd:#0e1b2c;--hdt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--card:#131f33;--tx:#eaf0f8;--mu:#8fa0b8;--ac:#ffc83d;--on:#0e1b2c;--bd:#233250;--hd:#131f33;--hdt:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1220;--card:#131f33;--tx:#eaf0f8;--mu:#8fa0b8;--ac:#ffc83d;--on:#0e1b2c;--bd:#233250;--hd:#131f33;--hdt:#fff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding-bottom:96px}
header{background:var(--hd);color:var(--hdt);padding:20px 18px 70px;border-radius:0 0 28px 28px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
h1 b{background:var(--ac);color:var(--on);padding:0 8px;border-radius:6px;margin-left:4px}
header p{margin:6px 0 0;color:#aebbd0;font-size:14px}
.search{background:var(--card);margin:-48px 14px 0;border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(10,20,40,.18)}
.route{position:relative;display:grid;gap:8px}
select,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:13px 14px}
.swap{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:2px solid var(--card);background:var(--ac);color:var(--on);font-size:18px;font-weight:800;cursor:pointer}
.route select{padding-right:56px}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.go{border:0;border-radius:12px;background:var(--ac);color:var(--on);font:inherit;font-weight:800;padding:0 22px;cursor:pointer}
.modes{display:flex;gap:6px;margin:16px 14px 0;overflow-x:auto}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sorts{margin-top:8px}
.sorts .chip{border-radius:8px;font-size:13px;padding:6px 11px}
#out{margin:14px 14px 0;display:grid;gap:10px}
.empty{color:var(--mu);text-align:center;padding:28px 10px}
.t{background:var(--card);border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;border:1px solid var(--bd)}
.times{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.times small{font-size:12px;color:var(--mu);font-weight:600}
.meta{color:var(--mu);font-size:13px}
.price{text-align:right;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.pick{grid-column:1/-1;border-top:2px dashed var(--bd);margin-top:6px;padding-top:10px;display:flex;justify-content:space-between;align-items:center}
.pick button{border:0;border-radius:10px;background:var(--tx);color:var(--bg);font:inherit;font-weight:600;padding:8px 16px;cursor:pointer}
.note{margin:18px 14px 0;color:var(--mu);font-size:12px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;max-width:90%;display:none;text-align:center}
header{position:relative}
.acc{position:absolute;right:14px;top:18px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid #3a4a66;background:transparent;color:var(--hdt);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
#tod{width:auto}
.sheet{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto}
.panel h2{margin:0 0 8px;font-size:20px}
.panel>.pick{border:0;margin-top:8px;padding-top:0}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.seat{padding:10px 0;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.seat:disabled{opacity:.3;cursor:not-allowed}
.seat[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:800}
#toast{z-index:9}
.vb{width:1.1em;height:1.1em;margin-left:6px;vertical-align:-.15em;flex:none}
.err{color:#e5484d;font-size:14px;margin:8px 0 0;min-height:1em}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;max-width:560px;margin:auto;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;color:var(--tx);font:inherit;font-size:20px;padding:8px 0 6px;display:grid;justify-items:center;cursor:pointer}
.tabs span{font-size:12px;color:var(--mu)}
.inst{display:flex;gap:8px;align-items:center;margin:12px 14px 0;padding:10px 12px;background:var(--card);border:1px dashed var(--bd);border-radius:12px;font-size:13px;color:var(--mu)}
.inst[hidden],.inst button[hidden]{display:none}
.inst span{flex:1}
.inst button{border:0;border-radius:8px;background:var(--ac);color:var(--on);font:inherit;font-size:13px;font-weight:600;padding:6px 10px;cursor:pointer}
.inst #ix{background:none;color:var(--mu)}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.tabs .ic{width:24px;height:24px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-train" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4"/><circle cx="9" cy="14" r=".6"/><circle cx="15" cy="14" r=".6"/></symbol>
<symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M7 21v-3M17 21v-3"/><circle cx="8" cy="14.5" r=".6"/><circle cx="16" cy="14.5" r=".6"/></symbol>
<symbol id="i-plane" viewBox="0 0 24 24"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4v16M7 4L3.5 7.5M7 4l3.5 3.5M17 20V4M17 20l-3.5-3.5M17 20l3.5-3.5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</defs></svg>
<header>
  <h1>Туту<b>Fixed</b></h1>
  <button class="acc" id="acc" type="button">Войти</button>
  <p>Поезда, автобусы и самолёты в одном поиске</p>
</header>

<section class="search" aria-label="Поиск поездок">
  <div class="route">
    <select id="from" aria-label="Откуда"></select>
    <select id="to" aria-label="Куда"></select>
    <button class="swap" id="swap" aria-label="Поменять местами"><svg class="ic"><use href="#i-swap"/></svg></button>
  </div>
  <div class="row2">
    <input type="date" id="date" aria-label="Дата">
    <button class="go" id="go">Найти</button>
  </div>
</section>

<div class="modes" id="modes">
  <button class="chip" data-m="all" aria-pressed="true">Всё</button>
  <button class="chip" data-m="train" aria-pressed="false"><svg class="ic"><use href="#i-train"/></svg> Поезд</button>
  <button class="chip" data-m="bus" aria-pressed="false"><svg class="ic"><use href="#i-bus"/></svg> Автобус</button>
  <button class="chip" data-m="plane" aria-pressed="false"><svg class="ic"><use href="#i-plane"/></svg> Самолёт</button>
</div>
<div class="modes sorts" id="sorts">
  <button class="chip" data-s="price" aria-pressed="true">Дешевле</button>
  <button class="chip" data-s="dur" aria-pressed="false">Быстрее</button>
  <button class="chip" data-s="dep" aria-pressed="false">Раньше</button><button class="chip" id="nt" aria-pressed="false">Без пересадок</button><select id="tod" class="chip" aria-label="Время отправления"><option value="">Любое время</option><option value="m">Утро</option><option value="d">День</option><option value="e">Вечер</option></select>
</div>

<div class="inst" id="inst" hidden><span id="it">Чтобы открывать как приложение: меню браузера → «Добавить на главный экран»</span><button type="button" id="ib" hidden>Установить</button><button type="button" id="ix" aria-label="Закрыть"><svg class="ic"><use href="#i-x"/></svg></button></div>
<div id="out"></div>
<p class="note">Демо-данные: расписание и цены вымышленные, оплата и реальные билеты не подключены.</p>
<nav class="tabs" aria-label="Разделы"><button type="button" id="tab-s"><svg class="ic"><use href="#i-search"/></svg><span>Поиск</span></button><button type="button" id="tab-a"><svg class="ic"><use href="#i-user"/></svg><span>Аккаунт</span></button></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
const CITIES=["Москва","Санкт-Петербург","Псков","Великие Луки","Тверь","Казань","Нижний Новгород","Сочи","Екатеринбург","Новосибирск","Калининград"];
const MODES={
  train:{n:"Поезд",e:"🚆",v:75,p:2.1,o:0,base:0,who:"Fixed Rail"},
  bus:{n:"Автобус",e:"🚌",v:55,p:1.5,o:0,base:0,who:"ФиксТранс"},
  plane:{n:"Самолёт",e:"✈️",v:720,p:4.2,o:150,base:1800,who:"Fixed Air"}
};
const ST={"Москва":["Ленинградский вокзал","Щёлковский автовокзал","SVO"],"Санкт-Петербург":["Московский вокзал","Автовокзал №2","LED"],"Псков":["Псков-Пассажирский","Автовокзал Пскова","PKV"],"Великие Луки":["Великие Луки","Автовокзал Великих Лук",""],"Тверь":["Тверь","Автовокзал Твери",""],"Казань":["Казань-Пассажирская","Автовокзал «Южный»","KZN"],"Нижний Новгород":["Московский вокзал","Автовокзал «Щербинки»","GOJ"],"Сочи":["Сочи","Автовокзал Сочи","AER"],"Екатеринбург":["Екатеринбург-Пассажирский","Автовокзал «Северный»","SVX"],"Новосибирск":["Новосибирск-Главный","Автовокзал «Красный проспект»","OVB"],"Калининград":["Калининград-Пассажирский","Автовокзал Калининграда","KGD"]};
const stn=(k,c)=>(ST[c]||[])[k==="train"?0:k==="bus"?1:2]||c;
let mode="all",sort="price",trips=[];
const $=id=>document.getElementById(id);

function h(s){let x=2166136261;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=m=>{const d=Math.floor(m/1440),x=m%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")+(d?`<small> +${d}</small>`:"")};
const dur=m=>Math.floor(m/60)+" ч "+String(m%60).padStart(2,"0")+" мин";
const rub=n=>n.toLocaleString("ru-RU")+" ₽";

function build(){
  const a=$("from").value,b=$("to").value,d=$("date").value;
  if(a===b){trips=[];return}
  const km=300+h([a,b].sort().join("|"))%2200;
  trips=[];
  for(const k in MODES){
    const M=MODES[k];
    if(k==="plane"&&(km<500||!ST[a][2]||!ST[b][2]))continue;
    const r=rng(h(a+b+d+k));
    for(let i=0;i<4;i++){
      const dep=360+Math.floor(r()*1000);
      let t=Math.round((km/M.v*60+M.o)*(.92+r()*.2));
      let price=Math.round((M.base+km*M.p)*(.8+r()*.5)/10)*10;const tr=r()<.35?1:0;if(tr){t=Math.round(t*1.3);price=Math.round(price*.85/10)*10}
      const num=100+Math.floor(r()*899);
      const code=k==="plane"?"FX "+num:k==="train"?"№ "+String(num).padStart(3,"0")+"А":"рейс "+num;
      trips.push({k,dep,t,arr:dep+t,price,code,tr});
    }
  }
}

function render(){
  const out=$("out");
  out.textContent="";
  const tod=$("tod").value,nt=$("nt").getAttribute("aria-pressed")==="true",B={m:[360,720],d:[720,1080],e:[1080,1440]};
  const list=trips.filter(x=>(mode==="all"||x.k===mode)&&!(nt&&x.tr)&&(!tod||(x.dep>=B[tod][0]&&x.dep<B[tod][1])))
    .sort((x,y)=>sort==="price"?x.price-y.price:sort==="dur"?x.t-y.t:x.dep-y.dep);
  if(!list.length){
    const p=document.createElement("p");p.className="empty";
    p.textContent=$("from").value===$("to").value?"Выберите разные города отправления и прибытия.":"Для этого вида транспорта рейсов на выбранную дату нет.";
    out.append(p);return;
  }
  for(const x of list){
    const M=MODES[x.k],el=document.createElement("article");
    el.className="t";
    el.innerHTML=`<div><div class="times">${fmt(x.dep)} – ${fmt(x.arr)}</div><div class="meta">${dur(x.t)} в пути · ${x.tr?"1 пересадка":"без пересадок"}</div><div class="meta">${stn(x.k,$("from").value)} → ${stn(x.k,$("to").value)}</div></div>
    <div class="price">${rub(x.price)}</div>
    <div class="pick"><span class="meta"><svg class="ic"><use href="#i-${x.k}"/></svg> ${M.n} · ${M.who} · ${x.code}</span><button type="button">Выбрать</button></div>`;
    el.querySelector("button").onclick=()=>openSeats(x);
    out.append(el);
  }
}

let tt;function toast(s){const t=$("toast");t.textContent=s;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",3500)}
function search(){build();render()}

for(const id of ["from","to"])for(const c of CITIES){const o=document.createElement("option");o.textContent=c;$(id).append(o)}
$("from").value="Москва";$("to").value="Санкт-Петербург";
const d0=new Date();d0.setDate(d0.getDate()+1);
$("date").value=d0.toISOString().slice(0,10);

const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let user=store.get("tf_user"),tickets=store.get("tf_tickets")||[],pending=null,chosen=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const OWNER_HASH="13201f638b981cc5d8324ada3efd920f485e71cf7f426db3d7e8ae18fe6ecc76";
async function sha(x){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("tutufixed:"+x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
const nz=x=>x.normalize("NFKC").toLowerCase().replace(/[^a-z\u0400-\u04ff0-9]/g,"");
const isRes=x=>{const n=nz(x);return n==="фиксед"||n.replace(/\u0456/g,"i").replace(/\u0445/g,"x").replace(/\u0435/g,"e")==="fixed"};
const nameHtml=u=>esc(u.name)+(u.v?'<svg class="vb" viewBox="0 0 24 24" role="img" aria-label="Подтверждённый аккаунт"><title>Подтверждённый аккаунт</title><rect x="4" y="4" width="16" height="16" rx="3.5" fill="#1d9bf0"/><rect x="4" y="4" width="16" height="16" rx="3.5" fill="#1d9bf0" transform="rotate(45 12 12)"/><path d="M8 12.4l2.6 2.6 5.6-5.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>':"");
if(user&&isRes(user.name)&&!user.v){user=null;store.set("tf_user",null)}
const hm=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const dd=d=>new Date(d+"T00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
function sheet(html){$("sheet").innerHTML='<div class="panel">'+html+'</div>';$("sheet").classList.add("on");$("cl").onclick=closeSheet}
function closeSheet(){$("sheet").classList.remove("on")}
function paintAcc(){$("acc").innerHTML=user?nameHtml(user):"Войти"}

function openAcc(){
  if(!user){
    sheet('<h2>Вход</h2><p class="meta">Аккаунт хранится только на этом устройстве.</p><input id="nm" placeholder="Имя" aria-label="Имя"><input id="em" type="email" placeholder="Почта" aria-label="Почта" style="margin-top:8px"><input id="cd" type="password" placeholder="Код владельца" aria-label="Код владельца" style="margin-top:8px;display:none"><p class="err" id="er" role="alert"></p><div class="pick"><button id="cl" type="button">Закрыть</button><button id="ok" type="button">Войти</button></div>');
    $("nm").oninput=()=>{$("cd").style.display=isRes($("nm").value)?"block":"none";$("er").textContent=""};
    $("ok").onclick=async()=>{
      const n=$("nm").value.trim();
      if(!n){toast("Введите имя");return}
      let v=false;
      if(isRes(n)){
        const c=$("cd").value.trim();
        if(!c||await sha(c)!==OWNER_HASH){$("er").textContent="Имя Fixed занято. Введите код владельца или выберите другое имя.";return}
        v=true;
      }
      user={name:v?"Fixed":n,email:$("em").value.trim(),v};store.set("tf_user",user);paintAcc();closeSheet();
      if(pending){const x=pending;pending=null;openSeats(x)}
    };
    return;
  }
  const list=tickets.map((t,i)=>`<div class="t" style="margin-bottom:8px"><div><div class="times">${esc(t.from)} → ${esc(t.to)}</div><div class="meta">${dd(t.date)}, ${t.dep} · ${esc(t.mode)} ${esc(t.code)} · место ${esc(t.seat)}</div></div><div class="price">${rub(t.price)}</div><div class="pick"><span class="meta">Билет ${esc(t.id)}</span><button data-o="${i}" type="button">Открыть</button> <button data-i="${i}" type="button">Вернуть</button></div></div>`).join("")||'<p class="empty">Билетов пока нет. Найдите поездку и выберите место.</p>';
  sheet(`<h2>${nameHtml(user)}</h2><p class="meta">${esc(user.email||"почта не указана")}</p><h2 style="margin-top:16px">Мои билеты</h2>${list}<div class="pick"><button id="cl" type="button">Закрыть</button><button id="lo" type="button">Выйти</button></div>`);
  document.querySelectorAll("button[data-o]").forEach(b=>b.onclick=()=>openTicket(+b.dataset.o));
  $("lo").onclick=()=>{user=null;store.set("tf_user",null);paintAcc();closeSheet()};
  document.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{tickets.splice(+b.dataset.i,1);store.set("tf_tickets",tickets);openAcc()});
}

function openSeats(x){
  if(!user){pending=x;toast("Сначала войдите в аккаунт");openAcc();return}
  const a=$("from").value,b=$("to").value,d=$("date").value,r=rng(h(a+b+d+x.code+"s"));
  let g="";chosen=null;
  for(let n=1;n<=10;n++)for(const c of ["А","Б","","В","Г"]){
    if(!c){g+="<span></span>";continue}
    g+=`<button class="seat" type="button" data-id="${n}${c}" aria-pressed="false" ${r()<.3?"disabled":""}>${n}${c}</button>`;
  }
  sheet(`<h2>Выберите место</h2><div class="meta">${esc(a)} → ${esc(b)} · ${dd(d)}, ${hm(x.dep)} · ${MODES[x.k].n} ${x.code} · ${rub(x.price)}</div><div class="seats">${g}</div><div class="pick"><button id="cl" type="button">Отмена</button><button id="buy" type="button">Купить билет</button></div>`);
  document.querySelectorAll(".seat").forEach(s=>s.onclick=()=>{document.querySelectorAll(".seat").forEach(o=>o.setAttribute("aria-pressed",o===s));chosen=s.dataset.id});
  $("buy").onclick=()=>{
    if(!chosen){toast("Выберите место");return}
    openPay(x,a,b,d,chosen);
    
  };
}
function openPay(x,a,b,d,seat){
  let m="Карта";
  sheet(`<h2>Оплата</h2><div class="meta">${esc(a)} → ${esc(b)} · ${dd(d)}, ${hm(x.dep)} · место ${esc(seat)}</div><div class="price" style="text-align:left;margin:12px 0">${rub(x.price)}</div><div class="modes" id="pm" style="margin:0"><button class="chip" type="button" aria-pressed="true">Карта</button><button class="chip" type="button" aria-pressed="false">СБП</button></div><p class="meta">Демо-оплата: реальные деньги и данные карты не используются.</p><div class="pick"><button id="cl" type="button">Назад</button><button id="pay" type="button">Оплатить</button></div>`);
  $("pm").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;[...$("pm").children].forEach(o=>o.setAttribute("aria-pressed",o===c));m=c.textContent};
  $("pay").onclick=()=>{
    const bt=$("pay");bt.disabled=true;bt.textContent="Проводим оплату…";
    setTimeout(()=>{
      tickets.unshift({id:String(h(a+b+d+x.code+seat)%900000+100000),from:a,to:b,date:d,dep:hm(x.dep),mode:MODES[x.k].n,code:x.code,seat,price:x.price,pay:m});
      store.set("tf_tickets",tickets);openTicket(0);
    },1100);
  };
}
function qr(seed){
  const r=rng(h(seed)),n=21;let p="";
  const fin=(x,y)=>{for(const [ox,oy] of [[0,0],[14,0],[0,14]])if(x>=ox&&x<ox+7&&y>=oy&&y<oy+7){const u=x-ox,v=y-oy;return(u==0||u==6||v==0||v==6||(u>=2&&u<=4&&v>=2&&v<=4))?1:0}return -1};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    let f=fin(x,y);
    if(f<0)f=((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))?0:(r()<.5?1:0);
    if(f)p+=`M${x} ${y}h1v1h-1z`;
  }
  return `<svg viewBox="-1 -1 23 23" style="width:190px;background:#fff;padding:6px;border-radius:12px"><path d="${p}" fill="#0e1b2c"/></svg>`;
}
function openTicket(i){
  const t=tickets[i];
  sheet(`<h2>Билет ${esc(t.id)}</h2><div class="times">${esc(t.from)} → ${esc(t.to)}</div><div class="meta">${dd(t.date)}, ${t.dep} · ${esc(t.mode)} ${esc(t.code)} · место ${esc(t.seat)}</div><div style="display:grid;justify-items:center;margin:14px 0">${qr(t.id+t.code)}<p class="meta">Демо-билет: код не действует на транспорте</p></div><div class="pick"><span class="meta">Оплачено: ${esc(t.pay||"—")} · ${rub(t.price)}</span><button id="cl" type="button">Готово</button></div>`);
}
$("acc").onclick=openAcc;
$("sheet").onclick=e=>{if(e.target===$("sheet"))closeSheet()};
$("nt").onclick=()=>{const b=$("nt");b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");render()};
$("tod").onchange=render;
$("tab-s").onclick=()=>{closeSheet();scrollTo({top:0,behavior:"smooth"})};
$("tab-a").onclick=openAcc;
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if(!standalone&&!store.get("tf_inst"))$("inst").hidden=false;
$("ix").onclick=()=>{$("inst").hidden=true;store.set("tf_inst",1)};
let ip=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;$("ib").hidden=false;$("it").textContent="Установите Туту Fixed как приложение";if(!standalone&&!store.get("tf_inst"))$("inst").hidden=false});
$("ib").onclick=()=>{if(ip)ip.prompt()};
paintAcc();
$("go").onclick=search;
$("date").onchange=search;$("from").onchange=search;$("to").onchange=search;
$("swap").onclick=()=>{const a=$("from").value;$("from").value=$("to").value;$("to").value=a;search()};
for(const [box,key] of [["modes","m"],["sorts","s"]]){
  $(box).onclick=e=>{
    const b=e.target.closest(".chip");if(!b||!b.dataset[key])return;
    [...$(box).children].filter(c=>c.dataset[key]).forEach(c=>c.setAttribute("aria-pressed",c===b));
    if(key==="m")mode=b.dataset.m;else sort=b.dataset.s;
    render();
  };
}
search();
